openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Adhyayaan internship learning API
servers:
  - url: /api
paths:
  /assessment:
    get:
      operationId: getAssessment
      responses:
        "200":
          description: Assessment size, retake availability, own draft, and own saved report history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentWorkspace" }
        "401": { description: Sign in to view the assessment }
  /assessment/attempts:
    post:
      operationId: startAssessment
      responses:
        "200":
          description: Existing draft or a new draft if there is no open draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentDraft" }
        "401": { description: Sign in to start }
        "429":
          $ref: "#/components/responses/AssessmentRetakeWait"
  /assessment/attempts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: saveAssessmentAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentChoiceInput" }
      responses:
        "200":
          description: Saved draft with the current path and newly available question, but no answer key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentDraft" }
        "400": { description: Unknown question or answer option }
        "401": { description: Sign in to save }
        "404": { description: Attempt not found }
        "409":
          description: Report submitted, question no longer on the current path, or confirmation needed to replace follow-up answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAnswerConflict" }
        "429":
          $ref: "#/components/responses/AssessmentRetakeWait"
  /assessment/attempts/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitAssessment
      responses:
        "200":
          description: Immutable educational report scored from saved answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReport" }
        "400": { description: Answer every question first }
        "401": { description: Sign in to submit }
        "404": { description: Attempt not found }
        "429":
          $ref: "#/components/responses/AssessmentRetakeWait"
  /assessment/reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLearningReport
      responses:
        "200":
          description: Own saved learning report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReport" }
        "401": { description: Sign in to view reports }
        "404": { description: Report not found }
  /admin/learners:
    get:
      operationId: listAdminLearners
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: assessment, in: query, schema: { type: string, enum: [all, completed, pending] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
      responses:
        "200":
          description: Student directory with platform totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDirectory" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
  /admin/learners/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminLearner
      responses:
        "200":
          description: Student details and learning activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLearnerDetail" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
        "404": { description: Student not found }
  /admin/learners/{id}/reports/{reportId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminLearningReport
      responses:
        "200":
          description: Audited access to a saved student report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReport" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
        "404": { description: Report not found }
  /study-media/01/{file}:
    parameters:
      - { name: file, in: path, required: true, schema: { type: string, pattern: '^(01-[0-9]{1,2}\.(svg|mp4)|consent-pilot\.(mp4|vtt|jpg))$' } }
    get:
      operationId: getStudyMedia
      responses:
        "200":
          description: Instructional diagram, narrated lesson, or pre-rendered pilot media
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
            text/vtt:
              schema: { type: string }
            image/jpeg:
              schema: { type: string, format: binary }
        "206":
          description: Byte range for video playback
        "404":
          description: Media not found
        "401":
          description: Sign in to generate and play the narrated lesson
        "429":
          description: Video generation rate limit reached
        "503":
          description: Video renderer unavailable; the lesson transcript remains readable
  /study-media/mentor-avatar.png:
    get:
      operationId: getStudyMentorAvatar
      responses:
        "200":
          description: Adhya, the illustrated learning mentor
          content:
            image/png:
              schema: { type: string, format: binary }
  /study/{courseId}:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStudyBook
      responses:
        "200":
          description: Authored study book and the signed-in learner's reading state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyBook" }
        "404":
          description: Course study book not yet authored
  /study/{courseId}/bn:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStudyBookBengali
      responses:
        "200":
          description: Indian Bengali study book and the signed-in learner's reading state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyBook" }
        "404":
          description: Bengali course material not available
  /study/{courseId}/progress:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: saveStudyProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyProgressInput" }
      responses:
        "200":
          description: Saved reading state, never internship hours or official completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyProgress" }
  /study/{courseId}/teach:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    post:
      operationId: teachStudy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyTeachingInput" }
      responses:
        "200":
          description: Saved, lesson-grounded formative feedback and adaptive next activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyTeaching" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/me:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationInput" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /courses:
    get:
      operationId: listCourses
      responses:
        "200":
          description: All 30 internship blueprints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
  /courses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCourse
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Authenticated student's actual learning overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401":
          description: Sign in to view your personal dashboard
  /enrollments:
    get:
      operationId: listEnrollments
      responses:
        "200":
          description: My internship pathways
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Enrollment" }
    post:
      operationId: enroll
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Enrolled in learning pathway, not a payment or college approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
  /enrollments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentUpdate" }
      responses:
        "200":
          description: Saved progress or project submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
  /logs:
    get:
      operationId: listLogs
      responses:
        "200":
          description: My practical work log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkLog" }
    post:
      operationId: createLog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogInput" }
      responses:
        "201":
          description: Work recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
  /logs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteLog
      responses:
        "200":
          description: Deleted own log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /ai/messages:
    get:
      operationId: listAiMessages
      responses:
        "200":
          description: Saved AI conversation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiMessage" }
    post:
      operationId: askAi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiInput" }
      responses:
        "200":
          description: AI learning assistance, not official assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMessage" }
  /practice:
    get:
      operationId: listPractice
      responses:
        "200":
          description: Own adaptive practice history with results only after submission
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PracticeAttempt" }
    post:
      operationId: startPractice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeInput" }
      responses:
        "201":
          description: Five cognitive questions at a difficulty adapted from prior results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeAttempt" }
  /practice/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitPractice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeAnswers" }
      responses:
        "200":
          description: Server-scored answers with explanations, cognitive levels and next difficulty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeAttempt" }
components:
  responses:
    AssessmentRetakeWait:
      description: The last assessment was submitted less than seven days ago
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssessmentRetakeWait" }
  schemas:
    AssessmentQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id: { type: string }
        prompt: { type: string }
        options: { type: array, items: { type: string } }
    AssessmentSection:
      type: object
      required: [id, title, instructions, questions]
      properties:
        id: { type: string }
        title: { type: string }
        instructions: { type: string }
        questions: { type: array, items: { $ref: "#/components/schemas/AssessmentQuestion" } }
    AssessmentChoice:
      type: object
      additionalProperties: false
      required: [questionId, choice]
      properties:
        questionId: { type: string, minLength: 1, maxLength: 30 }
        choice: { type: integer, minimum: 0, maximum: 4 }
    AssessmentChoiceInput:
      type: object
      additionalProperties: false
      required: [questionId, choice]
      properties:
        questionId: { type: string, minLength: 1, maxLength: 30 }
        choice: { type: integer, minimum: 0, maximum: 4 }
        replaceFollowUps: { type: boolean }
    AssessmentAnswerConflict:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [ASSESSMENT_SUBMITTED, QUESTION_CHANGED, FOLLOW_UPS_CHANGED] }
        affectedAnswers: { type: integer }
    AssessmentRetakeWait:
      type: object
      required: [error, code, nextRetakeAt]
      properties:
        error: { type: string }
        code: { type: string, enum: [ASSESSMENT_RETAKE_WAIT] }
        nextRetakeAt: { type: string }
    AssessmentDraft:
      type: object
      required: [id, version, answers, updatedAt, sections]
      properties:
        id: { type: string }
        version: { type: integer }
        answers: { type: array, items: { $ref: "#/components/schemas/AssessmentChoice" } }
        updatedAt: { type: string }
        sections: { type: array, items: { $ref: "#/components/schemas/AssessmentSection" } }
    LearningReportSummary:
      type: object
      required: [id, version, completedAt]
      properties:
        id: { type: string }
        version: { type: integer }
        completedAt: { type: string }
    AssessmentWorkspace:
      type: object
      required: [version, partCount, questionCount, nextRetakeAt, draft, reports]
      properties:
        version: { type: integer }
        partCount: { type: integer }
        questionCount: { type: integer }
        nextRetakeAt: { type: ["string", "null"] }
        draft:
          anyOf:
            - { $ref: "#/components/schemas/AssessmentDraft" }
            - { type: "null" }
        reports: { type: array, items: { $ref: "#/components/schemas/LearningReportSummary" } }
    LearningDimension:
      type: object
      required: [id, title, score, maxScore, interpretation, suggestion]
      properties:
        id: { type: string }
        title: { type: string }
        score: { type: integer }
        maxScore: { type: integer }
        interpretation: { type: string }
        suggestion: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/AnswerEvidence" }
    AnswerEvidence:
      type: object
      required: [prompt, response]
      properties:
        prompt: { type: string }
        response: { type: string }
    ReasoningReview:
      type: object
      required: [questionId, prompt, selected, correctAnswer, correct, explanation]
      properties:
        questionId: { type: string }
        prompt: { type: string }
        selected: { type: string }
        correctAnswer: { type: string }
        correct: { type: boolean }
        explanation: { type: string }
        skill: { type: string }
    CareerIdea:
      type: object
      required: [title, reason, skills, project, counsellorQuestion]
      properties:
        title: { type: string }
        reason: { type: string }
        skills: { type: array, items: { type: string } }
        project: { type: string }
        counsellorQuestion: { type: string }
        interestScore: { type: integer, minimum: 0 }
        interestMax: { type: integer, minimum: 1 }
    LearningReport:
      type: object
      required: [id, version, completedAt, dimensions, reasoning, strengths, growthAreas, nextSteps, careers, teachingPlan, methodology]
      properties:
        id: { type: string }
        version: { type: integer }
        completedAt: { type: string }
        dimensions: { type: array, items: { $ref: "#/components/schemas/LearningDimension" } }
        reasoning: { type: array, items: { $ref: "#/components/schemas/ReasoningReview" } }
        strengths: { type: array, items: { type: string } }
        growthAreas: { type: array, items: { type: string } }
        nextSteps: { type: array, items: { type: string } }
        careers: { type: array, items: { $ref: "#/components/schemas/CareerIdea" } }
        teachingPlan: { type: array, items: { type: string } }
        methodology: { type: string }
        scenarioInsights: { type: array, items: { type: string } }
    AdminLearnerRow:
      type: object
      required: [id, name, email, college, discipline, createdAt, assessmentCompletedAt, enrollmentCount]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        college: { type: string }
        discipline: { type: string }
        createdAt: { type: string }
        assessmentCompletedAt: { type: ["string", "null"] }
        enrollmentCount: { type: integer }
    AdminDirectory:
      type: object
      required: [students, page, pageSize, matchCount, learnerCount, completedCount, enrollmentCount]
      properties:
        students: { type: array, items: { $ref: "#/components/schemas/AdminLearnerRow" } }
        page: { type: integer }
        pageSize: { type: integer }
        matchCount: { type: integer }
        learnerCount: { type: integer }
        completedCount: { type: integer }
        enrollmentCount: { type: integer }
    AdminCourseProgress:
      type: object
      required: [courseId, title, completedModules, totalModules, loggedHours, targetHours, projectStatus, practiceCount, practiceAverage, lessonsRead, studyChecks, secureChecks]
      properties:
        courseId: { type: string }
        title: { type: string }
        completedModules: { type: integer }
        totalModules: { type: integer }
        loggedHours: { type: number }
        targetHours: { type: integer }
        projectStatus: { type: string }
        practiceCount: { type: integer }
        practiceAverage: { type: ["number", "null"] }
        lessonsRead: { type: integer }
        studyChecks: { type: integer }
        secureChecks: { type: integer }
    AdminLearnerDetail:
      type: object
      required: [student, courses, reports]
      properties:
        student: { $ref: "#/components/schemas/AdminLearnerRow" }
        courses: { type: array, items: { $ref: "#/components/schemas/AdminCourseProgress" } }
        reports: { type: array, items: { $ref: "#/components/schemas/LearningReportSummary" } }
    StudySection:
      type: object
      required: [heading, body]
      properties:
        heading: { type: string }
        body: { type: string }
    StudyLesson:
      type: object
      required: [id, title, minutes, sections, example, activity]
      properties:
        id: { type: string }
        title: { type: string }
        minutes: { type: integer }
        sections: { type: array, items: { $ref: "#/components/schemas/StudySection" } }
        example: { type: string }
        activity: { type: string }
    StudyModule:
      type: object
      required: [id, title, extended, objectives, lessons, imageUrl, imageAlt, steps, videoUrl, transcript, questions, sourceUrls]
      properties:
        id: { type: string }
        title: { type: string }
        extended: { type: boolean }
        objectives: { type: array, items: { type: string } }
        lessons: { type: array, items: { $ref: "#/components/schemas/StudyLesson" } }
        imageUrl: { type: string }
        imageAlt: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/StudySection" } }
        videoUrl: { type: string }
        transcript: { type: string }
        pilotVideo:
          $ref: "#/components/schemas/PilotVideo"
        questions:
          type: object
          required: [understand, apply, analyze]
          properties:
            understand: { type: string }
            apply: { type: string }
            analyze: { type: string }
        sourceUrls: { type: array, items: { type: string } }
    PilotChapter:
      type: object
      required: [title, start, end]
      properties:
        title: { type: string }
        start: { type: number, minimum: 0 }
        end: { type: number, minimum: 0 }
    PilotVideo:
      type: object
      required: [lessonId, title, duration, videoUrl, posterUrl, captionsUrl, transcript, chapters, checkpoints]
      properties:
        lessonId: { type: string }
        title: { type: string }
        duration: { type: number }
        videoUrl: { type: string }
        posterUrl: { type: string }
        captionsUrl: { type: string }
        transcript: { type: string }
        chapters: { type: array, items: { $ref: "#/components/schemas/PilotChapter" } }
        checkpoints: { type: array, items: { $ref: "#/components/schemas/VideoCheckpoint" } }
    VideoCheckpoint:
      type: object
      required: [id, at, question, hint, explanation, options]
      properties:
        id: { type: string }
        at: { type: number }
        question: { type: string }
        hint: { type: string }
        explanation: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/VideoAnswer" } }
    VideoAnswer:
      type: object
      required: [id, text, correct, feedback]
      properties:
        id: { type: string }
        text: { type: string }
        correct: { type: boolean }
        feedback: { type: string }
    StudyProgress:
      type: object
      required: [lessonId, read, bookmarked, updatedAt]
      properties:
        lessonId: { type: string }
        read: { type: boolean }
        bookmarked: { type: boolean }
        updatedAt: { type: string }
    StudyProgressInput:
      type: object
      required: [lessonId]
      properties:
        lessonId: { type: string, minLength: 1, maxLength: 80 }
        read: { type: boolean }
        bookmarked: { type: boolean }
    StudyTeachingInput:
      type: object
      required: [moduleId, level, answer, language]
      properties:
        moduleId: { type: string, maxLength: 80 }
        level: { type: string, enum: [understand, apply, analyze] }
        answer: { type: string, minLength: 15, maxLength: 4000 }
        language: { type: string, enum: [en, bn] }
    StudyTeaching:
      type: object
      required: [id, moduleId, level, answer, feedback, verdict, nextLevel, nextPrompt, revisit, createdAt]
      properties:
        id: { type: string }
        moduleId: { type: string }
        level: { type: string, enum: [understand, apply, analyze] }
        answer: { type: string }
        feedback: { type: string }
        verdict: { type: string, enum: [revisit, developing, secure] }
        nextLevel: { type: string, enum: [understand, apply, analyze] }
        nextPrompt: { type: string }
        revisit: { type: string }
        createdAt: { type: string }
    StudyBook:
      type: object
      required: [courseId, title, introduction, editorialNote, modules, progress, teaching]
      properties:
        courseId: { type: string }
        title: { type: string }
        introduction: { type: string }
        editorialNote: { type: string }
        modules: { type: array, items: { $ref: "#/components/schemas/StudyModule" } }
        progress: { type: array, items: { $ref: "#/components/schemas/StudyProgress" } }
        teaching: { type: array, items: { $ref: "#/components/schemas/StudyTeaching" } }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    User:
      type: object
      required: [id, name, email, college, discipline, assessmentRequired, assessmentCompletedAt, isAdmin]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        college: { type: string }
        discipline: { type: string }
        assessmentRequired: { type: boolean }
        assessmentCompletedAt: { type: ["string", "null"] }
        isAdmin: { type: boolean }
    Session:
      type: object
      required: [user]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
    RegistrationInput:
      type: object
      required: [name, email, password, college, discipline]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        college: { type: string, maxLength: 200 }
        discipline: { type: string, maxLength: 100 }
    Module:
      type: object
      required: [id, title, type, hours60, hours120, content]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        hours60: { type: number }
        hours120: { type: number }
        content: { type: string }
    Course:
      type: object
      required: [id, title, category, description, hours, price, mode, disciplines, modules, deliverable, draft, extendedDraft]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        hours: { type: integer }
        price: { type: integer }
        mode: { type: string }
        disciplines:
          type: array
          items: { type: string }
        modules:
          type: array
          items: { $ref: "#/components/schemas/Module" }
        deliverable: { type: string }
        draft: { type: boolean }
        extendedDraft: { type: boolean }
    EnrollmentInput:
      type: object
      required: [courseId, hours]
      properties:
        courseId: { type: string }
        hours: { type: integer, enum: [60, 120] }
    EnrollmentUpdate:
      type: object
      properties:
        completedModules:
          type: array
          items: { type: string }
        projectUrl: { type: string, maxLength: 2000 }
        reflection: { type: string, maxLength: 12000 }
        submit: { type: boolean }
    PacingModule:
      type: object
      required: [moduleId, estimatedHours, startWeek, endWeek, startDate, endDate]
      properties:
        moduleId: { type: string }
        estimatedHours: { type: number }
        startWeek: { type: integer }
        endWeek: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    EnrollmentPacing:
      type: object
      required: [totalHours, durationWeeks, startDate, targetDate, completedHours, completedPercent, expectedHours, expectedPercent, deltaHours, deltaDays, status, cohortPercentile, moduleSchedule]
      properties:
        totalHours: { type: integer, enum: [60, 120] }
        durationWeeks: { type: integer, enum: [8, 16] }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date }
        completedHours: { type: number }
        completedPercent: { type: integer, minimum: 0, maximum: 100 }
        expectedHours: { type: number }
        expectedPercent: { type: integer, minimum: 0, maximum: 100 }
        deltaHours: { type: number }
        deltaDays: { type: number }
        status: { type: string, enum: [ahead, on_track, behind, complete] }
        cohortPercentile: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        moduleSchedule:
          type: array
          items: { $ref: "#/components/schemas/PacingModule" }
    Enrollment:
      type: object
      required: [id, course, hours, completedModules, loggedHours, projectUrl, reflection, status, createdAt, pacing]
      properties:
        id: { type: string }
        course: { $ref: "#/components/schemas/Course" }
        hours: { type: integer }
        completedModules:
          type: array
          items: { type: string }
        loggedHours: { type: number }
        projectUrl: { type: string }
        reflection: { type: string }
        status: { type: string }
        createdAt: { type: string }
        pacing: { $ref: "#/components/schemas/EnrollmentPacing" }
    LogInput:
      type: object
      required: [enrollmentId, date, hours, activity, learning]
      properties:
        enrollmentId: { type: string }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        hours: { type: number, minimum: 0.25, maximum: 12 }
        activity: { type: string, minLength: 5, maxLength: 2000 }
        learning: { type: string, minLength: 5, maxLength: 3000 }
    WorkLog:
      type: object
      required: [id, enrollmentId, date, hours, activity, learning]
      properties:
        id: { type: string }
        enrollmentId: { type: string }
        date: { type: string }
        hours: { type: number }
        activity: { type: string }
        learning: { type: string }
    Stats:
      type: object
      required: [activeInternships, learningHours, completedModules, submittedProjects]
      properties:
        activeInternships: { type: integer }
        learningHours: { type: number }
        completedModules: { type: integer }
        submittedProjects: { type: integer }
    Activity:
      type: object
      required: [id, text, date, type]
      properties:
        id: { type: string }
        text: { type: string }
        date: { type: string }
        type: { type: string }
    Dashboard:
      type: object
      required: [preview, user, stats, enrollments, recommendations, activity]
      properties:
        preview: { type: boolean }
        user:
          anyOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        stats: { $ref: "#/components/schemas/Stats" }
        enrollments:
          type: array
          items: { $ref: "#/components/schemas/Enrollment" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Course" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    AiInput:
      type: object
      required: [tool, message, language]
      properties:
        tool: { type: string, enum: [tutor, quiz, planner, review, viva] }
        message: { type: string, minLength: 1, maxLength: 12000 }
        courseId: { type: string }
        language: { type: string, enum: [en, bn] }
    AiMessage:
      type: object
      required: [id, role, content, tool, createdAt]
      properties:
        id: { type: string }
        role: { type: string }
        content: { type: string }
        tool: { type: string }
        createdAt: { type: string }
    PracticeInput:
      type: object
      required: [courseId, language]
      properties:
        courseId: { type: string }
        language: { type: string, enum: [en, bn] }
    PracticeAnswers:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/PracticeAnswer" }
    PracticeAnswer:
      type: object
      required: [questionId, selectedIndex]
      properties:
        questionId: { type: string }
        selectedIndex: { type: integer, minimum: 0, maximum: 3 }
    PracticeQuestion:
      type: object
      required: [id, question, options, concept, cognitiveLevel]
      properties:
        id: { type: string }
        question: { type: string }
        options:
          type: array
          items: { type: string }
        concept: { type: string }
        cognitiveLevel: { type: string, enum: [understand, apply, analyze] }
    PracticeFeedback:
      type: object
      required: [questionId, selectedIndex, correctIndex, correct, explanation, concept, cognitiveLevel]
      properties:
        questionId: { type: string }
        selectedIndex: { type: integer }
        correctIndex: { type: integer }
        correct: { type: boolean }
        explanation: { type: string }
        concept: { type: string }
        cognitiveLevel: { type: string }
    PracticeAttempt:
      type: object
      required: [id, courseId, difficulty, nextDifficulty, language, adaptationReason, questions, score, feedback, createdAt]
      properties:
        id: { type: string }
        courseId: { type: string }
        difficulty: { type: integer }
        nextDifficulty: { type: integer }
        language: { type: string }
        adaptationReason: { type: string }
        questions:
          type: array
          items: { $ref: "#/components/schemas/PracticeQuestion" }
        score: { type: [integer, "null"] }
        feedback:
          type: array
          items: { $ref: "#/components/schemas/PracticeFeedback" }
        createdAt: { type: string }
