openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Adhyayaan internship learning API
servers:
  - url: /api
paths:
  /assessment:
    get:
      operationId: getAssessment
      responses:
        "200":
          description: Assessment size, retake availability, own draft, and own saved report history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentWorkspace" }
        "401": { description: Sign in to view the assessment }
  /assessment/attempts:
    post:
      operationId: startAssessment
      responses:
        "200":
          description: Existing draft or a new draft if there is no open draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentDraft" }
        "401": { description: Sign in to start }
        "429":
          $ref: "#/components/responses/AssessmentRetakeWait"
  /assessment/attempts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: saveAssessmentAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentChoiceInput" }
      responses:
        "200":
          description: Saved draft with the current path and newly available question, but no answer key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentDraft" }
        "400": { description: Unknown question or answer option }
        "401": { description: Sign in to save }
        "404": { description: Attempt not found }
        "409":
          description: Report submitted, question no longer on the current path, or confirmation needed to replace follow-up answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentAnswerConflict" }
        "429":
          $ref: "#/components/responses/AssessmentRetakeWait"
  /assessment/attempts/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitAssessment
      responses:
        "200":
          description: Immutable educational report scored from saved answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReport" }
        "400": { description: Answer every question first }
        "401": { description: Sign in to submit }
        "404": { description: Attempt not found }
        "429":
          $ref: "#/components/responses/AssessmentRetakeWait"
  /assessment/reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLearningReport
      responses:
        "200":
          description: Own saved learning report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReport" }
        "401": { description: Sign in to view reports }
        "404": { description: Report not found }
  /admin/learners:
    get:
      operationId: listAdminLearners
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: assessment, in: query, schema: { type: string, enum: [all, completed, pending] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
      responses:
        "200":
          description: Student directory with platform totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDirectory" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
  /admin/learners/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminLearner
      responses:
        "200":
          description: Student details and learning activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLearnerDetail" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
        "404": { description: Student not found }
  /admin/learners/{id}/reports/{reportId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminLearningReport
      responses:
        "200":
          description: Audited access to a saved student report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReport" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
        "404": { description: Report not found }
  /admin/guides:
    get:
      operationId: listAdminGuides
      responses:
        "200":
          description: Guide pool and enrolments that need guide follow-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGuidePool" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
    post:
      operationId: provisionAdminGuide
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGuideInput" }
      responses:
        "201":
          description: Existing account granted guide access and added to the guide pool
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGuide" }
        "400": { description: Invalid guide details or course coverage }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
        "404": { description: No account matches that email }
        "409": { description: An admin or Superadmin account cannot be changed to a guide }
  /admin/guides/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAdminGuide
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGuideUpdate" }
      responses:
        "200":
          description: Updated guide coverage or availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGuide" }
        "400": { description: Invalid guide settings }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
        "404": { description: Guide not found }
  /admin/enrollments/{id}/assign-guide:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: assignAdminGuide
      responses:
        "200":
          description: Unassigned enrolment assigned to the least-loaded eligible guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "401": { description: Sign in first }
        "403": { description: Administrator access required }
        "404": { description: Enrolment not found }
        "409": { description: A guide is already assigned or no eligible guide is available }
  /superadmin/analytics:
    get:
      operationId: getSuperadminAnalytics
      responses:
        "200":
          description: Platform-wide learner, guide and programme metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperadminAnalytics" }
        "401": { description: Sign in first }
        "403": { description: Superadmin access required }
  /superadmin/guides:
    post:
      operationId: createSuperadminGuide
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuperadminGuideInput" }
      responses:
        "201":
          description: New guide account and one-time temporary password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperadminGuideProvision" }
        "400": { description: Invalid guide details or course coverage }
        "401": { description: Sign in first }
        "403": { description: Superadmin access required }
        "409": { description: An account with this email already exists }
  /superadmin/guides/{id}/temporary-password:
    post:
      operationId: resetSuperadminGuidePassword
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One-time temporary password for an existing guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperadminGuidePasswordReset" }
        "400": { description: Invalid guide account identifier }
        "401": { description: Sign in first }
        "403": { description: Superadmin access required }
        "404": { description: Guide account not found }
  /superadmin/accounts:
    get:
      operationId: listSuperadminAccounts
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: role, in: query, schema: { type: string, enum: [all, student, admin, guide, superadmin] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
      responses:
        "200":
          description: Paginated account directory for role management
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperadminAccountDirectory" }
        "401": { description: Sign in first }
        "403": { description: Superadmin access required }
  /superadmin/accounts/{id}/role:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSuperadminAccountRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuperadminRoleUpdateInput" }
      responses:
        "200":
          description: Updated account role, with the change recorded for audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperadminAccount" }
        "400": { description: Invalid role change }
        "401": { description: Sign in first }
        "403": { description: Superadmin access required }
        "404": { description: Account not found }
        "409": { description: Self changes or removal of the last superadmin are not allowed }
  /guide/dashboard:
    get:
      operationId: getGuideDashboard
      parameters:
        - { name: courseId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Assigned learners across the guide's supported courses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideDashboard" }
        "400": { description: Course is not in this guide's coverage }
        "401": { description: Sign in first }
        "403": { description: Internship Guide access required }
  /guide/learners/{learnerId}/reports/{reportId}:
    parameters:
      - { name: learnerId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGuideLearningReport
      responses:
        "200":
          description: Saved report for an assigned learner; access is recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReport" }
        "401": { description: Sign in first }
        "403": { description: Internship Guide access required }
        "404": { description: Report or assigned learner not found }
  /mentorship/threads:
    get:
      operationId: listMentorshipThreads
      responses:
        "200":
          description: Course-specific conversations available to the signed-in student or guide
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MentorshipThread" }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
  /mentorship/notification-preference:
    get:
      operationId: getMentorshipNotificationPreference
      responses:
        "200":
          description: Browser notification preference for the signed-in student or guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorshipNotificationPreference" }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
    put:
      operationId: updateMentorshipNotificationPreference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MentorshipNotificationPreferenceInput" }
      responses:
        "200":
          description: Updated browser notification preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorshipNotificationPreference" }
        "400": { description: Invalid preference }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
  /mentorship/events:
    get:
      operationId: streamMentorshipNotifications
      responses:
        "200":
          description: Reconnecting event stream for messages sent to the signed-in student or guide
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
  /mentorship/threads/{enrollmentId}/messages:
    parameters:
      - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listMentorshipMessages
      responses:
        "200":
          description: Private conversation history; opening it marks messages through the latest message as read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorshipMessagesResponse" }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
        "404": { description: Course enrollment not found }
    post:
      operationId: sendMentorshipMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MentorshipMessageInput" }
      responses:
        "201":
          description: Message saved and sent to the course conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorshipMessage" }
        "400": { description: "Invalid message, meeting link, or attachment" }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
        "404": { description: Course enrollment not found }
  /mentorship/threads/{enrollmentId}/uploads:
    parameters:
      - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestMentorshipUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MentorshipUploadInput" }
      responses:
        "201":
          description: Short-lived private upload URL and signed attachment token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentorshipUploadResponse" }
        "400": { description: Unsupported file type or size }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
  /mentorship/threads/{enrollmentId}/events:
    parameters:
      - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: streamMentorshipEvents
      responses:
        "200":
          description: Reconnecting server-sent notifications for new conversation messages
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
  /mentorship/attachments/{attachmentId}:
    parameters:
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadMentorshipAttachment
      responses:
        "200":
          description: "Private attachment, available only to the student and currently assigned guide"
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Sign in first }
        "403": { description: Student or assigned guide access required }
        "404": { description: Attachment not found }
  /study-media/01/{file}:
    parameters:
      - { name: file, in: path, required: true, schema: { type: string, pattern: '^(01-[0-9]{1,2}\.(svg|mp4)|consent-pilot\.(mp4|vtt|jpg))$' } }
    get:
      operationId: getStudyMedia
      responses:
        "200":
          description: Instructional diagram, narrated lesson, or pre-rendered pilot media
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
            text/vtt:
              schema: { type: string }
            image/jpeg:
              schema: { type: string, format: binary }
        "206":
          description: Byte range for video playback
        "404":
          description: Media not found
        "401":
          description: Sign in to generate and play the narrated lesson
        "429":
          description: Video generation rate limit reached
        "503":
          description: Video renderer unavailable; the lesson transcript remains readable
  /study-media/mentor-avatar.png:
    get:
      operationId: getStudyMentorAvatar
      responses:
        "200":
          description: Adhya, the illustrated learning mentor
          content:
            image/png:
              schema: { type: string, format: binary }
  /study/{courseId}:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStudyBook
      responses:
        "200":
          description: Authored study book and the signed-in learner's reading state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyBook" }
        "404":
          description: Course study book not yet authored
  /study/{courseId}/bn:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStudyBookBengali
      responses:
        "200":
          description: Indian Bengali study book and the signed-in learner's reading state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyBook" }
        "404":
          description: Bengali course material not available
  /study/{courseId}/progress:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: saveStudyProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyProgressInput" }
      responses:
        "200":
          description: Saved reading state, never internship hours or official completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyProgress" }
  /study/{courseId}/teach:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    post:
      operationId: teachStudy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyTeachingInput" }
      responses:
        "200":
          description: Saved, lesson-grounded formative feedback and adaptive next activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyTeaching" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/me:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationInput" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/initial-password:
    post:
      operationId: completeInitialPasswordChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitialPasswordChangeInput" }
      responses:
        "200":
          description: Temporary password replaced with a new password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: New password does not meet the length requirement }
        "401": { description: Sign in first }
        "409": { description: This account does not need an initial password change }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /courses:
    get:
      operationId: listCourses
      responses:
        "200":
          description: All 30 internship blueprints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
  /courses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCourse
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Authenticated student's actual learning overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401":
          description: Sign in to view your personal dashboard
  /enrollments:
    get:
      operationId: listEnrollments
      responses:
        "200":
          description: My internship pathways
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Enrollment" }
    post:
      operationId: enroll
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentInput" }
      responses:
        "201":
          description: Enrolled in learning pathway, not a payment or college approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
  /enrollments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentUpdate" }
      responses:
        "200":
          description: Saved progress or project submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
  /logs:
    get:
      operationId: listLogs
      responses:
        "200":
          description: My practical work log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkLog" }
    post:
      operationId: createLog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogInput" }
      responses:
        "201":
          description: Work recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
  /logs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteLog
      responses:
        "200":
          description: Deleted own log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /ai/messages:
    get:
      operationId: listAiMessages
      responses:
        "200":
          description: Saved AI conversation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiMessage" }
    post:
      operationId: askAi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiInput" }
      responses:
        "200":
          description: AI learning assistance, not official assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMessage" }
  /practice:
    get:
      operationId: listPractice
      responses:
        "200":
          description: Own adaptive practice history with results only after submission
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PracticeAttempt" }
    post:
      operationId: startPractice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeInput" }
      responses:
        "201":
          description: Five cognitive questions at a difficulty adapted from prior results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeAttempt" }
  /practice/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitPractice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeAnswers" }
      responses:
        "200":
          description: Server-scored answers with explanations, cognitive levels and next difficulty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeAttempt" }
components:
  responses:
    AssessmentRetakeWait:
      description: The last assessment was submitted less than seven days ago
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssessmentRetakeWait" }
  schemas:
    AssessmentQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id: { type: string }
        prompt: { type: string }
        options: { type: array, items: { type: string } }
    AssessmentSection:
      type: object
      required: [id, title, instructions, questions]
      properties:
        id: { type: string }
        title: { type: string }
        instructions: { type: string }
